services:
  db:
    image: postgres:16-alpine
    container_name: ramellian-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ramellian-executive-travels
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ramellian-executive-travels"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ramellian-executive-travels:latest
    container_name: ramellian-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ramellian-executive-travels
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root

      # JWT
      JWT_SECRET: change-this-to-a-random-string-of-at-least-32-characters
      JWT_EXPIRATION_MS: "3600000"

      # Google OAuth
      GOOGLE_CLIENT_ID: "353452894856-d9tudsttmmma590akjuetpap5na22vs9.apps.googleusercontent.com"

      # Pesapal
      PESAPAL_BASE_URL: "https://cybqa.pesapal.com/pesapalv3"
      PESAPAL_CONSUMER_KEY: "qkio1BGGYAXTu2JOfm7XSXNruoZsrqEW"
      PESAPAL_CONSUMER_SECRET: "osGQ364R49cXKeOYSpaOnT++rHs="
      PESAPAL_CALLBACK_URL: https://ramellianexecutivetravels.co.ke/payment/success
      PESAPAL_NOTIFICATION_ID: 3a5925c7-3e7f-456e-b74e-d9d7bf372b79
      MANUAL_PAYMENT_CONFIRMATION_ENABLED: "false"

      # CORS & URLs
      CORS_ALLOWED_ORIGINS: https://ramellianexecutivetravels.co.ke
      FRONTEND_URL: https://ramellianexecutivetravels.co.ke
      SERVER_URL: https://ramellianexecutivetravels.co.ke

      # Email
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: washioyafelix@gmail.com
      SMTP_PASSWORD: hxjijjyfsbbwlige
      EMAIL_CURRENCY: KES
      VERIFICATION_CODE_EXPIRATION_MINUTES: "15"
      VERIFICATION_FROM_EMAIL: washioyafelix@gmail.com

      # Super Admin
      SUPER_ADMIN_EMAIL: superadmin@ramellian.com
      SUPER_ADMIN_PASSWORD: SuperAdmin@12345
      SUPER_ADMIN_PHONE: "+254700000000"
      SUPER_ADMIN_FIRST_NAME: Super
      SUPER_ADMIN_LAST_NAME: Admin

      # File uploads
      VEHICLE_PHOTO_DIRECTORY: uploads/vehicles
      DOCUMENT_DIRECTORY: uploads/documents
