services:
  db:
    image: postgres:16-alpine
    container_name: ramellian-db
    environment:
      POSTGRES_DB: ramellian-executive-travels
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ramellian-executive-travels"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ramellian-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ramellian-executive-travels
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-a-minimum-of-32-characters}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY:-qkio1BGGYAXTu2JOfm7XSXNruoZsrqEW}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET:-osGQ364R49cXKeOYSpaOnT++rHs=}
      PESAPAL_CALLBACK_URL: ${PESAPAL_CALLBACK_URL:-http://localhost:5173/payment/success}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      VEHICLE_PHOTO_DIRECTORY: uploads/vehicles
      DOCUMENT_DIRECTORY: uploads/documents
      CONTRACT_DIRECTORY: uploads/contracts
    volumes:
      - uploads_vehicles:/app/uploads/vehicles
      - uploads_documents:/app/uploads/documents
      - uploads_contracts:/app/uploads/contracts

volumes:
  postgres_data:
  uploads_vehicles:
  uploads_documents:
  uploads_contracts:
