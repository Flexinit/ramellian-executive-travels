services:
  db:
    image: postgres:16-alpine
    container_name: ramellian-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ramellian-executive-travels
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ramellian-executive-travels"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ramellian-executive-travels:latest
    container_name: ramellian-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ramellian-executive-travels
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: change-this-to-a-random-string-of-at-least-32-characters
      GOOGLE_CLIENT_ID: ""
      PESAPAL_CONSUMER_KEY: your-pesapal-key
      PESAPAL_CONSUMER_SECRET: your-pesapal-secret
      PESAPAL_CALLBACK_URL: https://your-domain/payment/success
      CORS_ALLOWED_ORIGINS: https://your-domain
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      VEHICLE_PHOTO_DIRECTORY: uploads/vehicles
      DOCUMENT_DIRECTORY: uploads/documents
      CONTRACT_DIRECTORY: uploads/contracts
    volumes:
      - uploads_vehicles:/app/uploads/vehicles
      - uploads_documents:/app/uploads/documents
      - uploads_contracts:/app/uploads/contracts

volumes:
  postgres_data:
  uploads_vehicles:
  uploads_documents:
  uploads_contracts: