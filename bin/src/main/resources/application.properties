spring.application.name=ramellian-executive-travels
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5433/ramellian-executive-travels
spring.datasource.username=postgres
spring.datasource.password=root
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.pathmatch.matching-strategy: ant_path_matcher
#server.error.include-message=always
#server.error.include-binding-errors=always
#server.error.include-stacktrace=always
#server.error.include-exception=true

logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.root=DEBUG
logging.level.com.ramellian_executive=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
spring.datasource.hikari.maximum-pool-size=10
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-minimum-of-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
